<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>保护马跃无敌版</title>
<link rel="icon" type="image/png" href="/icon.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #333; font-family: sans-serif; }
  
  #game-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  /* 顶部计数器 */
  #score-board {
    position: absolute;
    top: 70px; /* 往下移一点，给作弊者字样留空间 */
    width: 100%;
    text-align: center;
    color: #fff;
    font-size: 28px;
    z-index: 100;
    user-select: none;
  }

  /* ===== 新增：RGB炫彩3D旋转耀眼作弊者字样 ===== */
  #cheater-text {
    position: absolute;
    top: 5px;
    width: 100%;
    text-align: center;
    font-size: 56px;
    font-weight: 900;
    letter-spacing: 8px;
    z-index: 200;
    /* RGB 渐变背景 */
    background: linear-gradient(90deg, #ff0000, #ff7300, #ffcc00, #33ff00, #00ccff, #3300ff, #cc00ff, #ff0000);
    background-size: 800% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    /* 发光效果 */
    filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.9)) drop-shadow(0 0 25px rgba(255, 0, 255, 0.8)) drop-shadow(0 0 40px rgba(0, 255, 255, 0.6));
    /* 3D 旋转动画 */
    animation: rgbFlow 3s linear infinite, rotate3D 2.5s linear infinite;
    transform-style: preserve-3d;
  }

  @keyframes rgbFlow {
    0% { background-position: 0% 0; }
    100% { background-position: 100% 0; }
  }

  @keyframes rotate3D {
    0% { transform: perspective(600px) rotateX(15deg) rotateY(0deg) scale(1.05); }
    100% { transform: perspective(600px) rotateX(15deg) rotateY(360deg) scale(1.05); }
  }
  /* =========================================== */

  /* 开始游戏按钮 */
  #start-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 15px 40px;
    font-size: 22px;
    cursor: pointer;
    z-index: 101;
    border: none;
    border-radius: 8px;
    background: #4CAF50;
    color: white;
  }
  #start-btn:hover { background: #45a049; }

  /* 中间的图片 */
  #center-img {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 60px;
    height: 60px;
    display: none;
    z-index: 50;
  }

  /* 敌人图片 */
  .enemy {
    position: absolute;
    width: 40px;
    height: 40px;
    cursor: pointer;
    z-index: 60;
    user-select: none;
  }

  /* 屏幕抖动动画（已保留但无敌版不会触发） */
  @keyframes shake {
    0% { transform: translate(2px, 1px) rotate(0deg); }
    10% { transform: translate(-1px, -2px) rotate(-1deg); }
    20% { transform: translate(-3px, 0px) rotate(1deg); }
    30% { transform: translate(3px, 2px) rotate(0deg); }
    40% { transform: translate(1px, -1px) rotate(1deg); }
    50% { transform: translate(-1px, 2px) rotate(-1deg); }
    60% { transform: translate(-3px, 1px) rotate(0deg); }
    70% { transform: translate(3px, 1px) rotate(-1deg); }
    80% { transform: translate(-1px, -1px) rotate(1deg); }
    90% { transform: translate(1px, 2px) rotate(0deg); }
    100% { transform: translate(1px, -2px) rotate(-1deg); }
  }
  .shake {
    animation: shake 0.4s infinite;
  }
</style>
</head>
<body>

<div id="game-container">
  <!-- 作弊者提示 -->
  <div id="cheater-text">你这是作弊行为!走，跟我去自首</div>

  <div id="score-board">杀敌次数: <span id="score">0</span></div>
  <button id="start-btn">开始游戏</button>
  <img id="center-img" src="center.png" alt="Horsy">
  
  <audio id="bgm" src="bgm.mp3" loop preload="auto"></audio>
  <audio id="hit-sound" src="hit.ogg" preload="auto"></audio>
  <audio id="kill-sound" src="kill.ogg" preload="auto"></audio>
</div>

<script>
const killSound = document.getElementById('kill-sound');
const startBtn = document.getElementById('start-btn');
const centerImg = document.getElementById('center-img');
const scoreEl = document.getElementById('score');
const container = document.getElementById('game-container');
const hitSound = document.getElementById('hit-sound');
const bgm = document.getElementById('bgm');

let score = 0;
let gameRunning = false;
let enemies = [];
let animFrame;
let difficultyTimer;
let spawnTimer;

let baseSpeed = 1;       
let spawnInterval = 1200;
let spawnCount = 1;      

startBtn.addEventListener('click', () => {
  score = 0;
  updateScore();
  baseSpeed = 1;
  spawnInterval = 1200;
  spawnCount = 1;
  gameRunning = true;

  startBtn.style.display = 'none';
  centerImg.style.display = 'block';
  container.classList.remove('shake');

  enemies.forEach(e => e.el.remove());
  enemies = [];

  bgm.currentTime = 0;
  bgm.play().catch(err => console.log('背景音乐播放失败:', err));

  loop();

  clearInterval(difficultyTimer);
  difficultyTimer = setInterval(() => {
    if (!gameRunning) return;
    baseSpeed += 0.3;              
    spawnCount += 1;               
    spawnInterval = Math.max(300, spawnInterval - 150); 
    resetSpawner();
  }, 1000);

  resetSpawner();
});

function resetSpawner() {
  clearTimeout(spawnTimer);
  function spawn() {
    if (!gameRunning) return;
    for (let i = 0; i < spawnCount; i++) {
      createEnemy();
    }
    spawnTimer = setTimeout(spawn, spawnInterval);
  }
  spawn();
}

function createEnemy() {
  const el = document.createElement('img');
  el.src = 'enemy.png';   
  el.className = 'enemy';

  const w = window.innerWidth;
  const h = window.innerHeight;

  const edge = Math.floor(Math.random() * 4);
  let x, y;
  if (edge === 0)      { x = Math.random() * w; y = -50; } 
  else if (edge === 1) { x = w + 10; y = Math.random() * h; } 
  else if (edge === 2) { x = Math.random() * w; y = h + 10; } 
  else                 { x = -50; y = Math.random() * h; } 

  el.style.left = x + 'px';
  el.style.top = y + 'px';
  container.appendChild(el);

  const centerX = w / 2;
  const centerY = h / 2;
  const dx = centerX - (x + 20);
  const dy = centerY - (y + 20);
  const dist = Math.sqrt(dx * dx + dy * dy);
  const vx = (dx / dist) * baseSpeed;
  const vy = (dy / dist) * baseSpeed;

  const enemyObj = { el, x, y, vx, vy };
  enemies.push(enemyObj);

  el.addEventListener('click', (e) => {
    if (!gameRunning) return;
    score++;
    updateScore();
    
    // 播放击杀音效
    killSound.currentTime = 0;
    killSound.play().catch(err => console.log('击杀音效播放失败:', err));

    
    el.remove();
    enemies = enemies.filter(en => en !== enemyObj);
    e.stopPropagation();
  });
}

function loop() {
  if (!gameRunning) return;

  const centerRect = centerImg.getBoundingClientRect();
  const cx = centerRect.left + centerRect.width / 2;
  const cy = centerRect.top + centerRect.height / 2;
  const cr = centerRect.width / 2; 

  for (let i = enemies.length - 1; i >= 0; i--) {
    const en = enemies[i];
    en.x += en.vx;
    en.y += en.vy;
    en.el.style.left = en.x + 'px';
    en.el.style.top = en.y + 'px';

    const ex = en.x + 20; 
    const ey = en.y + 20; 
    const dist = Math.sqrt((ex - cx) ** 2 + (ey - cy) ** 2);

    // ===== 无敌版修改：移除了 gameOver() 调用，敌人碰到中心也不会失败 =====
    if (dist < cr + 20) { 
      // 什么都不做，敌人会直接穿过中心继续飞行，游戏永远不会结束！
    }
  }

  animFrame = requestAnimationFrame(loop);
}

// gameOver 函数已保留但不会被调用，作为保险
function gameOver() {
  // 无敌版不执行任何结束操作
  console.log("想失败？不可能！你是作弊者！");
}

function updateScore() {
  scoreEl.textContent = score;
}
</script>
</body>
</html>
